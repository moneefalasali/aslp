<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دخول المسؤولين - منصة التعلم الذكي</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gradient flex items-center justify-center min-h-screen" style="background: linear-gradient(to bottom right, #fef2f2, #fee2e2);">
    <div class="container max-w-3xl" style="display: flex; justify-content: center;">
        <div class="card" style="width: 100%; max-width: 400px; padding: 2rem; border-top: 4px solid #dc2626;">
            <div style="text-align: center; margin-bottom: 1.5rem;">
                <i data-lucide="shield-check" style="width: 3rem; height: 3rem; color: #dc2626; margin: 0 auto;"></i>
            </div>
            <h2 style="text-align: center; font-size: 1.5rem; font-weight: bold; margin-bottom: 0.5rem;">لوحة تحكم المسؤول</h2>
            <p style="text-align: center; color: #6b7280; margin-bottom: 2rem;">هذه المنطقة مخصصة لمسؤولي النظام فقط</p>
            
            <div id="error-alert" class="alert alert-error hidden" style="margin-bottom: 1.5rem;">
                <i data-lucide="alert-circle"></i>
                <p id="error-message"></p>
            </div>

            <form id="admin-login-form">
                <div style="margin-bottom: 1.5rem;">
                    <label style="display: block; font-size: 0.875rem; font-weight: 500; margin-bottom: 0.5rem;">اسم المستخدم</label>
                    <input type="text" id="username" required style="width: 100%; padding: 0.75rem; border: 1px solid #d1d5db; border-radius: 0.5rem;" placeholder="اسم مسؤول النظام">
                </div>
                <div style="margin-bottom: 1.5rem;">
                    <label style="display: block; font-size: 0.875rem; font-weight: 500; margin-bottom: 0.5rem;">كلمة المرور</label>
                    <input type="password" id="password" required style="width: 100%; padding: 0.75rem; border: 1px solid #d1d5db; border-radius: 0.5rem;" placeholder="كلمة مرور المسؤول">
                </div>
                <button type="submit" id="submit-btn" class="btn btn-primary btn-block btn-lg" style="background-color: #dc2626;">دخول المسؤول</button>
            </form>

            <div style="text-align: center; margin-top: 1.5rem; font-size: 0.875rem;">
                <a href="/" style="color: #6b7280; text-decoration: none;">العودة للرئيسية</a>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();
        document.getElementById('admin-login-form').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            const errorAlert = document.getElementById('error-alert');
            const errorMsg = document.getElementById('error-message');
            
            btn.disabled = true;
            btn.textContent = 'جاري التحقق...';
            errorAlert.classList.add('hidden');

            try {
                const res = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('username').value,
                        password: document.getElementById('password').value
                    })
                });

                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || 'فشل دخول المسؤول');

                localStorage.setItem('admin_token', data.access_token);
                localStorage.setItem('admin', JSON.stringify(data.admin));
                window.location.href = '/admin-dashboard';
            } catch (err) {
                errorMsg.textContent = err.message;
                errorAlert.classList.remove('hidden');
                btn.disabled = false;
                btn.textContent = 'دخول المسؤول';
            }
        };
    </script>
</body>
</html>
