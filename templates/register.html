<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب - منصة التعلم الذكي</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gradient flex items-center justify-center min-h-screen">
    <div class="container max-w-3xl" style="display: flex; justify-content: center; padding: 2rem 0;">
        <div class="card" style="width: 100%; max-width: 450px; padding: 2rem;">
            <h2 style="text-align: center; font-size: 1.5rem; font-weight: bold; margin-bottom: 0.5rem;">إنشاء حساب جديد</h2>
            <p style="text-align: center; color: #6b7280; margin-bottom: 2rem;">انضم إلينا وابدأ رحلتك التعليمية الذكية</p>
            
            <div id="error-alert" class="alert alert-error hidden" style="margin-bottom: 1.5rem;">
                <i data-lucide="alert-circle"></i>
                <p id="error-message"></p>
            </div>

            <div id="success-alert" class="alert alert-success hidden" style="margin-bottom: 1.5rem;">
                <i data-lucide="check-circle"></i>
                <p>تم إنشاء الحساب بنجاح! سيتم تحويلك لتسجيل الدخول...</p>
            </div>

            <form id="register-form">
                <div style="margin-bottom: 1.25rem;">
                    <label style="display: block; font-size: 0.875rem; font-weight: 500; margin-bottom: 0.5rem;">الاسم الكامل</label>
                    <input type="text" id="fullName" required style="width: 100%; padding: 0.75rem; border: 1px solid #d1d5db; border-radius: 0.5rem;" placeholder="أدخل اسمك الكامل">
                </div>
                <div style="margin-bottom: 1.25rem;">
                    <label style="display: block; font-size: 0.875rem; font-weight: 500; margin-bottom: 0.5rem;">اسم المستخدم</label>
                    <input type="text" id="username" required style="width: 100%; padding: 0.75rem; border: 1px solid #d1d5db; border-radius: 0.5rem;" placeholder="اختر اسم مستخدم">
                </div>
                <div style="margin-bottom: 1.25rem;">
                    <label style="display: block; font-size: 0.875rem; font-weight: 500; margin-bottom: 0.5rem;">البريد الإلكتروني</label>
                    <input type="email" id="email" required style="width: 100%; padding: 0.75rem; border: 1px solid #d1d5db; border-radius: 0.5rem;" placeholder="example@mail.com">
                </div>
                <div style="margin-bottom: 1.25rem;">
                    <label style="display: block; font-size: 0.875rem; font-weight: 500; margin-bottom: 0.5rem;">كلمة المرور</label>
                    <input type="password" id="password" required style="width: 100%; padding: 0.75rem; border: 1px solid #d1d5db; border-radius: 0.5rem;" placeholder="6 أحرف على الأقل">
                </div>
                <div style="margin-bottom: 2rem;">
                    <label style="display: block; font-size: 0.875rem; font-weight: 500; margin-bottom: 0.5rem;">تأكيد كلمة المرور</label>
                    <input type="password" id="confirmPassword" required style="width: 100%; padding: 0.75rem; border: 1px solid #d1d5db; border-radius: 0.5rem;" placeholder="أعد إدخال كلمة المرور">
                </div>
                <button type="submit" id="submit-btn" class="btn btn-primary btn-block btn-lg" style="background-color: #059669;">إنشاء الحساب</button>
            </form>

            <div style="text-align: center; margin-top: 1.5rem; font-size: 0.875rem;">
                <span style="color: #6b7280;">لديك حساب بالفعل؟ </span>
                <a href="/login" style="color: #059669; font-weight: 600; text-decoration: none;">تسجيل الدخول</a>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();
        document.getElementById('register-form').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            const errorAlert = document.getElementById('error-alert');
            const successAlert = document.getElementById('success-alert');
            const errorMsg = document.getElementById('error-message');
            
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (password !== confirmPassword) {
                errorMsg.textContent = 'كلمات المرور غير متطابقة';
                errorAlert.classList.remove('hidden');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'جاري الإنشاء...';
            errorAlert.classList.add('hidden');

            try {
                const res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('username').value,
                        email: document.getElementById('email').value,
                        password: password,
                        full_name: document.getElementById('fullName').value
                    })
                });

                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || 'فشل إنشاء الحساب');

                successAlert.classList.remove('hidden');
                setTimeout(() => {
                    window.location.href = '/login';
                }, 2000);
            } catch (err) {
                errorMsg.textContent = err.message;
                errorAlert.classList.remove('hidden');
                btn.disabled = false;
                btn.textContent = 'إنشاء الحساب';
            }
        };
    </script>
</body>
</html>
